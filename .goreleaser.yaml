version: 2

project_name: bomexpo

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: antaresrvish
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/antaresrvish/bomexpo"
    description: "KiCad fabrication tool: assign LCSC parts and export a JLCPCB order straight from a .kicad_pcb"
    license: "MIT"
    install: |
      bin.install "bomexpo"
    test: |
      system "#{bin}/bomexpo", "--version"
