version: 2

project_name: bomexpo

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: antaresrvish
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/antaresrvish/bomexpo"
    description: "KiCad fabrication tool: assign LCSC parts and export a JLCPCB order straight from a .kicad_pcb"
    license: "MIT"
    install: |
      bin.install "bomexpo"
    test: |
      system "#{bin}/bomexpo", "--version"

winget:
  - name: bomexpo
    publisher: antaresrvish
    short_description: "KiCad fabrication tool: assign LCSC parts and export a JLCPCB order from a .kicad_pcb"
    license: MIT
    homepage: "https://github.com/antaresrvish/bomexpo"
    skip_upload: '{{ if eq .Env.WINGET_GITHUB_TOKEN "" }}true{{ else }}false{{ end }}'
    repository:
      owner: antaresrvish
      name: winget-pkgs
      branch: "bomexpo-{{.Version}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

aurs:
  - name: bomexpo-bin
    homepage: "https://github.com/antaresrvish/bomexpo"
    description: "KiCad fabrication tool: assign LCSC parts and export a JLCPCB order from a .kicad_pcb"
    maintainers:
      - "antaresrvish <antaresrvish@users.noreply.github.com>"
    license: MIT
    skip_upload: '{{ if eq .Env.AUR_KEY "" }}true{{ else }}false{{ end }}'
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/bomexpo-bin.git"
    provides:
      - bomexpo
    conflicts:
      - bomexpo
    package: |-
      install -Dm755 "./bomexpo" "${pkgdir}/usr/bin/bomexpo"
